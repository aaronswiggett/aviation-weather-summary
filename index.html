<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Flight Category Summary | GitHub Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .loader { border-top-color: #3498db; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .table-container { max-height: 60vh; overflow: auto; }
        table thead th { position: sticky; top: 0; background-color: #f9fafb; z-index: 10; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-7xl bg-white rounded-xl shadow-lg p-6 md:p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">Aviation Flight Category Summary</h1>
             <p class="text-gray-600 mt-2">Professional METAR Analysis & TAF Overlay System</p>
        </div>

        <form id="dataForm" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8 items-end">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">State (e.g., NC)</label>
                <input type="text" id="state" class="w-full px-3 py-2 border rounded-md" value="NC" maxlength="2" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Airport (e.g., RDU)</label>
                <input type="text" id="airport" class="w-full px-3 py-2 border rounded-md" value="RDU" maxlength="4" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                <input type="date" id="date-picker" class="w-full px-3 py-2 border rounded-md" required>
            </div>
            <div class="sm:col-span-3">
                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-md hover:bg-indigo-700 transition">Fetch METAR Data</button>
            </div>
        </form>

        <div id="results" class="hidden">
            <div id="loading" class="flex justify-center items-center my-8 hidden">
                <div class="loader rounded-full border-8 border-t-8 border-gray-200 h-16 w-16"></div>
                <p class="ml-4 text-gray-600">Attempting connection...</p>
            </div>
            <div id="error" class="text-center my-8 p-4 bg-red-50 text-red-700 border border-red-200 rounded-md hidden"></div>
            
            <div class="w-full border rounded-lg table-container mb-8">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead id="summary-head" class="bg-gray-50"></thead>
                    <tbody id="summary-body" class="bg-white"></tbody>
                </table>
            </div>

            <h2 class="text-xl font-bold text-gray-800 mb-4">Raw Data Log</h2>
            <div class="w-full border rounded-lg table-container">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead id="raw-head" class="bg-gray-50"></thead>
                    <tbody id="raw-body" class="bg-white"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const CATEGORY_MAP = {
            'VFR':      { style: 'bg-blue-100 text-blue-800 border', shade: 'bg-blue-50' },
            'MVFR':     { style: 'bg-green-100 text-green-800 border', shade: 'bg-green-50' },
            'MVFR_ALT': { style: 'bg-green-700 text-white', shade: 'bg-green-800' },
            'IFR':      { style: 'bg-yellow-100 text-yellow-800 border', shade: 'bg-yellow-50' },
            'LIFR':     { style: 'bg-red-100 text-red-800 border', shade: 'bg-red-50' },
            'VLIFR':    { style: 'bg-purple-100 text-purple-800 border', shade: 'bg-purple-50' }
        };

        const DEFAULT_CRITERIA = {
            mvfr_vsby: 5, mvfr_cig: 3000, mvfr_alt_cig: 2000,
            ifr_vsby: 3, ifr_cig: 1000, lifr_vsby: 2, lifr_cig: 600,
            vlifr_vsby: 0.5, vlifr_cig: 200
        };

        let appState = { reports: [], criteria: { ...DEFAULT_CRITERIA }, sortAsc: true };

        function getCategory(vis, cig) {
            const c = appState.criteria;
            if (vis < c.vlifr_vsby || cig < c.vlifr_cig) return 'VLIFR';
            if (vis < c.lifr_vsby || cig < c.lifr_cig) return 'LIFR';
            if (vis < c.ifr_vsby || cig < c.ifr_cig) return 'IFR';
            if (cig < c.mvfr_alt_cig) return 'MVFR_ALT';
            if (vis <= c.mvfr_vsby || cig < c.mvfr_cig) return 'MVFR';
            return 'VFR';
        }

        function parseMetar(metar) {
            const main = metar.split(' RMK ')[0];
            const visMatch = main.match(/(?:\s)(M?(\d{1,2}\s)?\d{1,2}\/\d{1,2}SM|\d{1,2}SM)(?:\s)/);
            const visStr = visMatch ? visMatch[1] : '10SM';
            let ceiling = 99999;
            const clouds = main.match(/(SKC|CLR|FEW\d{3}|SCT\d{3}|BKN\d{3}|OVC\d{3}|VV\d{3})/g);
            if (clouds) {
                clouds.forEach(l => {
                    if (l.match(/BKN|OVC|VV/)) {
                        const alt = parseInt(l.substring(3)) * 100;
                        if (alt < ceiling) ceiling = alt;
                    }
                });
            }
            // Simplified vis parser for speed
            let visNum = parseFloat(visStr.replace(/[^\d./]/g, '')) || 10;
            return { visibility: visStr, clouds: clouds ? clouds.join(' ') : 'CLR', category: getCategory(visNum, ceiling) };
        }

        async function fetchData() {
            const st = document.getElementById('state').value.toUpperCase();
            const ar = document.getElementById('airport').value.toUpperCase();
            const d = new Date(document.getElementById('date-picker').value);
            
            document.getElementById('results').classList.remove('hidden');
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('error').classList.add('hidden');

            const nextD = new Date(d); nextD.setDate(d.getDate() + 1);

            // Create explicit integers to avoid Pydantic list errors
            const y1 = d.getUTCFullYear(), m1 = d.getUTCMonth() + 1, d1 = d.getUTCDate();
            const y2 = nextD.getUTCFullYear(), m2 = nextD.getUTCMonth() + 1, d2 = nextD.getUTCDate();

            const iemUrl = `https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?network=${st}_ASOS&station=${ar}&data=all&year1=${y1}&month1=${m1}&day1=${d1}&year2=${y2}&month2=${m2}&day2=${d2}&tz=Etc/UTC&format=onlycomma&report_type=1&report_type=3`;

            // List of proxies to try in order of reliability
            const proxyPool = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(iemUrl)}`,
                `https://api.codetabs.com/v1/proxy?url=${encodeURIComponent(iemUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(iemUrl)}`
            ];

            let success = false;
            for (let proxy of proxyPool) {
                if (success) break;
                try {
                    const res = await fetch(proxy);
                    if (!res.ok) throw new Error(`Proxy status ${res.status}`);
                    const text = await res.text();
                    if (text.includes("<!DOCTYPE html>")) throw new Error("Invalid response");

                    const lines = text.trim().split('\n').filter(l => !l.startsWith('#'));
                    if (lines.length < 2) continue;

                    const headers = lines[0].split(',');
                    const sIdx = headers.indexOf('station'), vIdx = headers.indexOf('valid'), mIdx = headers.indexOf('metar');

                    appState.reports = lines.slice(1).map(l => {
                        const v = l.split(',');
                        return { station: v[sIdx], valid: v[vIdx], date: new Date(v[vIdx].replace(' ', 'T') + 'Z'), metar: v[mIdx], ...parseMetar(v[mIdx]) };
                    }).sort((a,b) => a.date - b.date);

                    renderUI();
                    success = true;
                } catch (e) { console.warn(`Proxy failed: ${proxy}`, e); }
            }

            if (!success) {
                document.getElementById('error').textContent = "All connections failed. Please check your network or try again in 5 minutes.";
                document.getElementById('error').classList.remove('hidden');
            }
            document.getElementById('loading').classList.add('hidden');
        }

        function renderUI() {
            // Render Summary
            const head = document.getElementById('summary-head');
            const body = document.getElementById('summary-body');
            head.innerHTML = '<tr><th class="px-4 py-2">Category</th>' + [...Array(24).keys()].map(h => `<th class="px-1 text-xs">${h}Z</th>`).join('') + '</tr>';
            
            const totals = {};
            Object.keys(CATEGORY_MAP).forEach(k => totals[k] = Array(24).fill(0));
            for (let i = 0; i < appState.reports.length - 1; i++) {
                const cur = appState.reports[i], next = appState.reports[i+1];
                const mins = (next.date - cur.date) / 60000;
                if (mins > 0 && mins <= 15) totals[cur.category][cur.date.getUTCHours()] += mins;
            }

            body.innerHTML = Object.keys(CATEGORY_MAP).map(cat => {
                let row = `<td class="px-4 py-2 text-xs font-bold"><span class="px-2 rounded ${CATEGORY_MAP[cat].style}">${cat}</span></td>`;
                for(let h=0; h<24; h++) {
                    const m = Math.round(totals[cat][h]);
                    row += `<td class="px-1 text-center text-[10px] ${m > 0 ? CATEGORY_MAP[cat].shade : ''}">${m || ''}</td>`;
                }
                return `<tr>${row}</tr>`;
            }).join('');

            // Render Raw Log
            const rawBody = document.getElementById('raw-body');
            rawBody.innerHTML = appState.reports.map(r => `<tr><td class="px-4 py-1 font-mono text-xs">${r.station}</td><td class="px-4 py-1 font-mono text-xs">${r.valid}</td><td class="px-4 py-1 text-xs">${r.visibility}</td><td class="px-4 py-1 text-xs">${r.clouds}</td><td class="px-4 py-1 text-xs font-bold"><span class="${CATEGORY_MAP[r.category].style} px-2 rounded">${r.category}</span></td></tr>`).join('');
        }

        document.getElementById('dataForm').onsubmit = (e) => { e.preventDefault(); fetchData(); };
        document.getElementById('date-picker').valueAsDate = new Date();
    </script>
</body>
</html>
